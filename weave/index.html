<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weaving Pattern</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="viewer">

    <div id="pattern-container">
        <img id="pattern" alt="Weaving pattern">
        <div id="dim-overlay"></div>
    </div>

    <div id="row-marker"></div>

    <div id="advance-hint" class="hidden">
        <span id="keyboard-hint">Press Space/Backspace to go forward/backward</span>
        <span id="touch-hint">Touch to advance</span>
    </div>
</div>

<div id="setup">
    <div id="setup-content">

        <label id="file-button">
            Upload pattern image (PNG/JPEG)
            <input
                    type="file"
                    id="file"
            >
        </label>

        <div id="saved-patterns"></div>

    </div>
</div>

<div id="controls">
    <button id="setup-button"><img src="icons/gear.svg" alt="Setup"></button>

    <button id="end-button" title="Go to end"><img src="icons/end.svg" alt=""></button>

    <button id="forward-button" title="Next row"><img src="icons/forward.svg" alt=""></button>

    <div id="row-counter"></div>

    <button id="back-button" title="Previous row"><img src="icons/backward.svg" alt=""></button>

    <button id="start-button" title="Go to start"><img src="icons/start.svg" alt=""></button>
</div>

<script src="pattern.js"></script>

</body>
</html>
